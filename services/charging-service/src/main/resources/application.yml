server:
  port: 8003
spring:
  application:
    name: charging-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/charging_db}
    username: ${DB_USER:charging_user}
    password: ${DB_PASSWORD:charging_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
