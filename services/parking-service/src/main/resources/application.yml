server:
  port: 8001
spring:
  application:
    name: parking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/parking_db}
    username: ${DB_USER:parking_user}
    password: ${DB_PASSWORD:parking_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
